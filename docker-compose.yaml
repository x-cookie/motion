services:
  motion-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MOTION_PORT:-8000}:8000"
    volumes:
      - motion-data:/data
    environment:
      # ============================================
      # Core Settings (motion-core)
      # ============================================
      # Database (default: /data/tasks.db in container)
      - MOTION_STORAGE_DATABASE_URL=sqlite:////data/tasks.db
      - MOTION_STORAGE_BACKEND=${MOTION_STORAGE_BACKEND:-sqlite}

      # Region for holiday detection (ISO 3166-1 alpha-2, e.g., JP, US)
      - MOTION_REGION_COUNTRY=${MOTION_REGION_COUNTRY:-}

      # ============================================
      # Server Settings (motion-server)
      # ============================================
      # Authentication (enable/disable via env var; API keys are configured in server.toml)
      - MOTION_AUTH_ENABLED=${MOTION_AUTH_ENABLED:-false}

      # ============================================
      # CLI/TUI Settings (for docker exec usage)
      # ============================================
      # API connection (CLI inside container connects to localhost)
      - MOTION_API_HOST=127.0.0.1
      - MOTION_API_PORT=8000
      - MOTION_API_KEY=${MOTION_API_KEY}
    restart: unless-stopped

volumes:
  motion-data:
