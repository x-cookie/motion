[project]
name = "motion-ui"
version = "0.18.5"
description = "CLI and TUI for Motion task management system"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kohei Wada" }
]
license = { text = "MIT" }
keywords = ["task", "management", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "motion-core==0.18.5",
    "motion-client==0.18.5",
    "click>=8.3.0",
    "rich>=14.2.0",
    "textual>=8.0.0",
    "python-dateutil>=2.8.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=1.0.0",
    "mypy>=1.0.0",
    "ruff>=0.7.0",
]
server = [
    "motion-server==0.18.5",
]

[project.scripts]
motion = "motion.cli_main:cli"

[project.urls]
Homepage = "https://github.com/Kohei-Wada/motion"
Repository = "https://github.com/Kohei-Wada/motion"
"Bug Tracker" = "https://github.com/Kohei-Wada/motion/issues"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "motion",
    "motion.formatters",
    "motion.services",
    "motion.cli",
    "motion.cli.commands",
    "motion.tui",
    "motion.tui.commands",
    "motion.tui.constants",
    "motion.tui.palette",
    "motion.tui.palette.providers",
    "motion.tui.services",
    "motion.tui.utils",
    "motion.tui.screens",
    "motion.tui.dialogs",
    "motion.tui.widgets",
    "motion.tui.forms",
    "motion.tui.forms.suggesters",
    "motion.tui.forms.validators",
    "motion.tui.state",
    "motion.tui.styles",
    "motion.console",
    "motion.renderers",
    "motion.exporters",
    "motion.constants",
    "motion.presenters",
    "motion.view_models",
    "motion.utils",
    "motion.shared",
    "motion.shared.click_types",
    "motion.infrastructure",
]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
motion = ["py.typed"]
"motion.tui.styles" = ["*.tcss"]

[tool.mypy]
python_version = "3.13"
strict = true
# Disable unused-ignore warnings (environment-dependent)
warn_unused_ignores = false

# Ignore missing imports for motion_client (installed separately)
[[tool.mypy.overrides]]
module = "motion_client"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
