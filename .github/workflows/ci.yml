name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check lock file is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linter
        run: make lint

      - name: Run spell checker
        run: uv tool run codespell

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install -e packages/motion-core
          uv pip install -e packages/motion-server
          uv pip install -e packages/motion-ui

      - name: Run type checker
        run: make typecheck

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: motion-core
            deps: ""
          - package: motion-client
            deps: "uv pip install -e packages/motion-core[dev]"
          - package: motion-server
            deps: "uv pip install -e packages/motion-core[dev]"
          - package: motion-ui
            deps: "uv pip install -e packages/motion-core[dev] && uv pip install -e packages/motion-client[dev]"
          - package: motion-mcp
            deps: "uv pip install -e packages/motion-core[dev] && uv pip install -e packages/motion-client[dev]"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          ${{ matrix.deps }}
          uv pip install -e "packages/${{ matrix.package }}[dev]"

      - name: Run tests
        run: make test-${{ matrix.package }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run security audit
        run: uv tool run pip-audit --skip-editable --progress-spinner off

  build:
    name: Build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [motion-core, motion-client, motion-server, motion-ui, motion-mcp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build packages/${{ matrix.package }}
